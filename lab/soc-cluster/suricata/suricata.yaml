%YAML 1.1
---
# Suricata 7.x Configuration — SOC Benchmarking Lab
# Mounted at: /etc/suricata/suricata.yaml
#
# Capture interface: virbr1 (libvirt bridge for VM target subnet 10.0.1.0/24)
# This is set via the Docker CMD argument: -i virbr1
#
# Key design decisions for this study:
#   - EVE JSON is the ONLY alert output format (feeds the Python pipeline in Week 6)
#   - Fast log and stats log enabled for operational debugging
#   - Emerging Threats Open rules are the baseline ruleset
#   - All rule categories enabled by default; tuning is a Week 7+ task

##############################################################################
# VARIABLE DEFINITIONS
##############################################################################
vars:
  address-groups:
    HOME_NET: "[10.0.1.0/24]"        # Target VM subnet (Ubuntu targets)
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544

##############################################################################
# CAPTURE SETTINGS
# Interface is passed via CMD: -i virbr1
##############################################################################
af-packet:
  - interface: virbr1
    # Number of receive threads (match CPU cores available to container)
    threads: 4
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes
    ring-size: 2048
    block-size: 32768
    block-timeout: 10
    use-emergency-flush: yes

##############################################################################
# DETECTION ENGINE
##############################################################################
detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 25
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000

##############################################################################
# OUTPUTS
# EVE JSON is the PRIMARY output consumed by the Python data pipeline (Week 6).
##############################################################################
outputs:
  # ── EVE JSON — Primary structured output ──────────────────────────────────
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      # Rotate daily to keep log sizes manageable
      rotate-interval: day
      # Include packet payload in alerts (base64) for deeper analysis
      pcap-file: false
      community-id: true
      community-id-seed: 0
      types:
        - alert:
            # Include full rule metadata in alert records
            metadata: yes
            tagged-packets: yes
        - http:
            extended: yes
        - dns:
            version: 2
        - tls:
            extended: yes
        - files:
            force-magic: no
        - smtp: {}
        - flow: {}
        - netflow: {}
        - stats:
            totals: yes
            threads: no
            deltas: no
        - anomaly:
            enabled: yes
            types:
              decode: no
              stream: no
              applayer: yes

  # ── Fast log — Human readable quick view ──────────────────────────────────
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

  # ── Statistics log — For resource overhead analysis (RQ6) ─────────────────
  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes
      threads: no

  # ── Alert debug log — disable in production, useful for lab debugging ──────
  - alert-debug:
      enabled: no
      filename: alert-debug.log
      append: yes

##############################################################################
# LOGGING
##############################################################################
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        level: info
        filename: suricata.log
        append: yes

##############################################################################
# RULE FILES
# Rules are downloaded via suricata-update to /var/lib/suricata/rules/
# Run after container start: docker exec suricata suricata-update
##############################################################################
default-rule-path: /var/lib/suricata/rules

rule-files:
  - suricata.rules     # Merged output from suricata-update (ET Open baseline)

##############################################################################
# RULE MANAGEMENT (suricata-update sources)
# Uncomment to enable additional rulesets (Week 7 tuning)
##############################################################################
# source-list:
#   - emerging-threats-open   # Free, no registration required
#   - ptresearch-attackdetection
#   - sslbl-ja3-fingerprints

##############################################################################
# APP LAYER PROTOCOLS
##############################################################################
app-layer:
  protocols:
    krb5:
      enabled: yes
    ikev2:
      enabled: yes
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    dcerpc:
      enabled: yes
    smtp:
      enabled: yes
      raw-extraction: no
      mime:
        decode-mime: yes
        decode-base64: yes
        decode-quoted-printable: yes
        header-value-depth: 2000
        extract-urls: yes
        body-md5: no
      inspected-tracker:
        content-limit: 100000
        content-inspect-min-size: 32768
        content-inspect-window: 4096
    imap:
      enabled: detection-only
    ssh:
      enabled: yes
    ftp:
      enabled: yes
    dns:
      enabled: yes
      detection-ports:
        dp: 53
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100kb
          response-body-limit: 100kb
          request-body-minimal-inspect-size: 32kb
          request-body-inspect-window: 4kb
          response-body-minimal-inspect-size: 40kb
          response-body-inspect-window: 16kb
          response-body-decompress-layer-limit: 2
          http-body-inline: auto
          swf-decompression:
            enabled: yes
            type: both
            compress-depth: 0
            decompress-depth: 0
          double-decode-path: no
          double-decode-query: no
    modbus:
      enabled: no
    dnp3:
      enabled: no
    enip:
      enabled: no
    nfs:
      enabled: yes
    ikev2:
      enabled: yes
    tftp:
      enabled: yes
    smb:
      enabled: yes
      detection-ports:
        dp: [139, 445]
    dcerpc:
      enabled: yes
    rdp:
      enabled: yes
    snmp:
      enabled: yes
    tftp:
      enabled: yes
    sip:
      enabled: no
    rfb:
      enabled: yes
      detection-ports:
        dp: 5900
    mqtt:
      enabled: no
    http2:
      enabled: yes

##############################################################################
# STREAM SETTINGS
##############################################################################
stream:
  memcap: 256mb
  checksum-validation: yes
  inline: no               # IDS mode (not IPS) — no packet dropping
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

##############################################################################
# HOST TABLE
##############################################################################
host:
  hash-size: 4096
  prealloc: 1000
  memcap: 32mb

##############################################################################
# FLOW SETTINGS
##############################################################################
flow:
  memcap: 128mb
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30

flow-timeouts:
  default:
    new: 30
    established: 300
    closed: 0
    bypassed: 100
    emergency-new: 10
    emergency-established: 100
    emergency-closed: 0
    emergency-bypassed: 50
  tcp:
    new: 60
    established: 600
    closed: 60
    bypassed: 100
    emergency-new: 5
    emergency-established: 100
    emergency-closed: 10
    emergency-bypassed: 50
  udp:
    new: 30
    established: 300
    bypassed: 100
    emergency-new: 10
    emergency-established: 100
    emergency-bypassed: 50
  icmp:
    new: 30
    established: 300
    bypassed: 100
    emergency-new: 10
    emergency-established: 100
    emergency-bypassed: 50
