# TheHive 5 — application.conf
# Mounted at: /etc/thehive/application.conf
#
# Backend: Cassandra (graph DB) + MinIO (file storage)
# This is a minimal single-node lab configuration.

play.http.secret.key = "SuperSecretKeyForLabUseOnly1234567890"

# ─── Database (Cassandra) ───────────────────────────────────────────────────
db.janusgraph {
  storage {
    backend: cql
    hostname: ["cassandra"]
    cql {
      keyspace: thehive
      local-datacenter: datacenter1
    }
  }
  index.search {
    backend: lucene
    directory: /opt/thehive/index
  }
}

# ─── File Storage (MinIO / S3) ──────────────────────────────────────────────
storage {
  provider: s3
  s3 {
    bucket: "thehive"
    readTimeout: 1 minute
    writeTimeout: 1 minute
    chunkSize: 1 MB
    endpoint: "http://minio:9000"
    accessKey: "thehive"
    secretKey: "MinioP@ssw0rd!"
    region: "us-east-1"
    pathStyleAccess: true
  }
}

# ─── Application ────────────────────────────────────────────────────────────
application.baseUrl = "http://localhost:9095"
play.http.parser.maxMemoryBuffer = 256k

# ─── Authentication ─────────────────────────────────────────────────────────
auth {
  providers: [
    { name: session }
    { name: basic, realm: thehive }
    { name: local }
    { name: key }
  ]
  # Default admin credentials on first start: admin@thehive.local / secret
  # CHANGE THIS before any production use.
}

# ─── Cortex Integration ─────────────────────────────────────────────────────
# Connects TheHive to the Cortex container for observable enrichment.
# API key must be set after Cortex is initialised (Week 3 task).
cortex {
  servers: [
    {
      name: "cortex-local"
      url: "http://cortex:9001"
      auth {
        type: "bearer"
        key: "17R5sx2/bR5ju8tr3GsmG6tiYdCz6dfa"
      }
      # Proxy settings (not needed for lab)
      wsConfig {}
    }
  ]
  # Refresh analyzer list from Cortex every 5 minutes
  refreshDelay: 5 minutes
}

# ─── Notification / Webhook to Shuffle ──────────────────────────────────────
# Triggers Shuffle SOAR workflows on new alert/case creation.
# Webhook URL must be set after Shuffle is configured (Week 3 task).
notification.webhook.endpoints = [
  {
    name: "shuffle-webhook"
    url: "http://shuffle-backend:5001/api/v1/hooks/webhook_7f1dcfba-e9e9-4d2b-9926-e1f931fc1f46"
    version: "0"
    auth {}
    wsConfig {}
    includedTheHiveOrganisations: ["*"]
    excludedTheHiveOrganisations: []
  }
]
