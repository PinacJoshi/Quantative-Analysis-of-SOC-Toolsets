# Wazuh Indexer — Internal users (hashed passwords)
# Mounted at: /usr/share/wazuh-indexer/opensearch-security/internal_users.yml
#
# Passwords are bcrypt hashed.
# admin     → SecureWazuh1!
# kibanaserver → kibanaserver
#
# To regenerate hashes:
#   docker run --rm wazuh/wazuh-indexer:4.9.2 bash -c \
#     "/usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p 'YourPassword'"

_meta:
  type: "internalusers"
  config_version: 2

admin:
  hash: "$2y$12$m6XKhZMwBRygT6vGzLOQZuNs5E2WErm7n5LJQaAP1C9m7wHqYv8m."
  reserved: true
  backend_roles:
    - "admin"
  description: "Wazuh admin user"

kibanaserver:
  hash: "$2y$12$3NKHZrEjUMj9/oUhjDIRCO9gE/uvXoG19ztRLsAc.Z0yP0gmNNtDW"
  reserved: true
  description: "OpenSearch Dashboards user"

wazuh-wui:
