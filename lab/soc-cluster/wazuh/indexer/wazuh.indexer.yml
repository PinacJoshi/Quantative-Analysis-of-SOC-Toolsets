# Wazuh Indexer — OpenSearch node configuration
# Mounted at: /usr/share/wazuh-indexer/opensearch.yml

network.host: 0.0.0.0
node.name: wazuh-indexer
cluster.name: wazuh-cluster

# Single-node mode — cluster.initial_master_nodes must NOT be set
# alongside discovery.type: single-node (OpenSearch will reject both)
discovery.type: single-node

### Option to allow Filebeat-oss 7.10.2 to work ###
compatibility.override_main_response_version: true

# Security plugin — absolute paths to the mounted cert directory
plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/certs/esnode.pem
plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/certs/esnode-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/certs/esnode.pem
plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/certs/esnode-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/certs/root-ca.pem
plugins.security.allow_default_init_securityindex: true
plugins.security.authcz.admin_dn:
  - CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US
plugins.security.nodes_dn:
  - CN=wazuh-indexer,OU=Wazuh,O=Wazuh,L=California,C=US

# Performance tuning for lab (single node, ~16 GB host)
indices.memory.index_buffer_size: 10%
path.data: /var/lib/wazuh-indexer
path.logs: /var/log/wazuh-indexer
