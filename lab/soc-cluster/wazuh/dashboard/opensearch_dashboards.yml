# Wazuh Dashboard — OpenSearch Dashboards configuration
# Mounted at: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml

server.host: "0.0.0.0"
server.port: 5601
server.name: "wazuh-dashboard"

opensearch.hosts: ["https://wazuh-indexer:9200"]
opensearch.ssl.verificationMode: none
opensearch.username: "kibanaserver"
opensearch.password: "kibanaserver"
opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]

opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles: ["kibana_read_only"]

# Wazuh App plugin settings
# These are read by the Wazuh app on first load
wazuh.monitoring.enabled: false   # Disable monitoring UI for lab (reduces overhead)
logging.verbose: false
