<!--
  Wazuh Manager — ossec.conf
  Minimal lab configuration for SOC benchmarking study.
  Mounted at: /var/ossec/etc/ossec.conf

  Key settings for the study:
  - Agents connect from the VM subnets (10.0.1.0/24, 10.0.2.0/24)
  - Indexer output to wazuh-indexer container
  - JSON alerts enabled for Python pipeline ingestion (Week 6)
  - FIM configured on target VM directories
  - Syscheck frequency reduced for lab speed (not production)
-->

<ossec_config>

  <!-- ═══════════════════════════════════════════════════════════════════
       GLOBAL SETTINGS
  ═══════════════════════════════════════════════════════════════════ -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <!-- Maximum alert level before dropping (0 = keep all) -->
    <white_list>127.0.0.1</white_list>
    <white_list>172.20.0.0/24</white_list>   <!-- SOC cluster internal -->
  </global>

  <!-- ═══════════════════════════════════════════════════════════════════
       RULES
  ═══════════════════════════════════════════════════════════════════ -->
  <rules>
    <include>rules_config.xml</include>
    <include>pam_rules.xml</include>
    <include>sshd_rules.xml</include>
    <include>telnetd_rules.xml</include>
    <include>syslog_rules.xml</include>
    <include>arpwatch_rules.xml</include>
    <include>symantec-av_rules.xml</include>
    <include>symantec-ws_rules.xml</include>
    <include>pix_rules.xml</include>
    <include>named_rules.xml</include>
    <include>smbd_rules.xml</include>
    <include>vsftpd_rules.xml</include>
    <include>pure-ftpd_rules.xml</include>
    <include>proftpd_rules.xml</include>
    <include>ms_ftpd_rules.xml</include>
    <include>ftpd_rules.xml</include>
    <include>hordeimp_rules.xml</include>
    <include>roundcube_rules.xml</include>
    <include>wordpress_rules.xml</include>
    <include>cimserver_rules.xml</include>
    <include>vpn_concentrator_rules.xml</include>
    <include>cisco-ios_rules.xml</include>
    <include>netscreenfw_rules.xml</include>
    <include>sonicwall_rules.xml</include>
    <include>postfix_rules.xml</include>
    <include>sendmail_rules.xml</include>
    <include>imapd_rules.xml</include>
    <include>mailscanner_rules.xml</include>
    <include>dovecot_rules.xml</include>
    <include>ms-exchange_rules.xml</include>
    <include>racoon_rules.xml</include>
    <include>vpn_concentrator_rules.xml</include>
    <include>spamd_rules.xml</include>
    <include>msauth_rules.xml</include>
    <include>mcafee_av_rules.xml</include>
    <include>trend-osce_rules.xml</include>
    <include>ms-se_rules.xml</include>
    <include>zeus_rules.xml</include>
    <include>solaris_bsm_rules.xml</include>
    <include>apache_rules.xml</include>
    <include>nginx_rules.xml</include>
    <include>php_rules.xml</include>
    <include>mysql_rules.xml</include>
    <include>postgresql_rules.xml</include>
    <include>ids_rules.xml</include>
    <include>squid_rules.xml</include>
    <include>firewall_rules.xml</include>
    <include>opensmtpd_rules.xml</include>
    <include>exim_rules.xml</include>
    <include>ufw_rules.xml</include>
    <include>ossec_rules.xml</include>
    <include>attack_rules.xml</include>
    <include>openbsd_rules.xml</include>
    <include>clam_av_rules.xml</include>
    <include>evolve_rules.xml</include>
    <include>virusTotal_rules.xml</include>
    <include>gpg_rules.xml</include>
    <include>auditd_rules.xml</include>  <!-- Critical for Atomic Red Team -->
    <include>docker_rules.xml</include>
    <include>unbound_rules.xml</include>
    <include>sysmon_rules.xml</include>  <!-- If sysmon agent added later -->
    <!-- Custom local rules for ATT&CK test labeling (Week 4+) -->
    <include>local_rules.xml</include>
  </rules>

  <!-- ═══════════════════════════════════════════════════════════════════
       ALERTS OUTPUT
  ═══════════════════════════════════════════════════════════════════ -->
  <alerts>
    <!-- Minimum severity level to generate an alert (1–15) -->
    <log_alert_level>3</log_alert_level>
    <!-- Minimum severity level to send email (disabled) -->
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ═══════════════════════════════════════════════════════════════════
       WAZUH INDEXER OUTPUT
       Forwards alerts to the wazuh-indexer container
  ═══════════════════════════════════════════════════════════════════ -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh-indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

  <!-- ═══════════════════════════════════════════════════════════════════
       REMOTE (AGENT CONNECTIONS)
       Agents on the VM target subnet (10.0.1.0/24) connect here
  ═══════════════════════════════════════════════════════════════════ -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <allowed-ips>10.0.1.0/24</allowed-ips>   <!-- Target VM subnet -->
    <allowed-ips>10.0.2.0/24</allowed-ips>   <!-- Attacker VM subnet (optional) -->
    <allowed-ips>172.20.0.0/24</allowed-ips> <!-- SOC Docker internal -->
  </remote>

  <!-- ═══════════════════════════════════════════════════════════════════
       FILE INTEGRITY MONITORING (FIM / Syscheck)
       Monitors critical paths on the manager itself.
       Agent-side FIM is configured in each agent's ossec.conf.
  ═══════════════════════════════════════════════════════════════════ -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Scan frequency: 600s (10 min) for lab — reduce for faster FIM testing -->
    <frequency>600</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Directories to monitor on manager (adjust for target VMs via agent config) -->
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>

    <!-- Ignore volatile paths -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
  </syscheck>

  <!-- ═══════════════════════════════════════════════════════════════════
       ACTIVE RESPONSE
       Disabled during benchmarking to avoid interfering with test cases.
       Enable in Week 9 for SOAR/MTTR experiments.
  ═══════════════════════════════════════════════════════════════════ -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <!-- ═══════════════════════════════════════════════════════════════════
       WODLE: VULNERABILITY DETECTOR (disabled for lab)
  ═══════════════════════════════════════════════════════════════════ -->
  <wodle name="vulnerability-detector">
    <disabled>yes</disabled>
  </wodle>

  <!-- ═══════════════════════════════════════════════════════════════════
       LOG ANALYSIS — Manager local logs
  ═══════════════════════════════════════════════════════════════════ -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]*\).\+\ \([[:digit:]]*\/[[:alnum:]\_\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==\ /:\1->/'</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

</ossec_config>
