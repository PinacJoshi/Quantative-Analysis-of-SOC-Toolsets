###############################################################################
#  SOC Cluster — Docker Compose
#  Week 2: Lab Infrastructure & Virtual Network Setup
#
#  Stack: Wazuh (Manager + Indexer + Dashboard) · TheHive 5 · Cortex 3
#         · Shuffle SOAR · Suricata (host-network, IDS-only)
#
#  Host machine: Fedora, Intel i5-11400H, 16 GB RAM
#  Network mode for SOC internal comms: custom bridge  soc-net (172.20.0.0/24)
#  Suricata: host network mode — sniffs virbr1 (VM target subnet bridge)
#
#  Usage:
#    docker compose up -d          # start all services
#    docker compose down -v        # stop and remove volumes
#    docker compose logs -f <svc>  # tail a service log
#
#  DO NOT run docker compose up until you have reviewed this file.
###############################################################################

name: soc-cluster

###############################################################################
# NETWORKS
###############################################################################
networks:
  soc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

###############################################################################
# VOLUMES
###############################################################################
volumes:
  # ── Wazuh ──────────────────────────────────────────────────────────────────
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-var:
  wazuh-dashboard-config:

  # ── TheHive ────────────────────────────────────────────────────────────────
  thehive-data:
  thehive-index:
  cassandra-data:
  minio-data:

  # ── Cortex ─────────────────────────────────────────────────────────────────
  cortex-data:

  # ── Shuffle ────────────────────────────────────────────────────────────────
  shuffle-data:
  shuffle-apps:
  opensearch-data:

###############################################################################
# SERVICES
###############################################################################
services:

  # ════════════════════════════════════════════════════════════════════════════
  # WAZUH — INDEXER (OpenSearch)
  # ════════════════════════════════════════════════════════════════════════════
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.10
    ports:
      - "9200:9200"       # OpenSearch REST API (local access only)
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./wazuh/indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:SecureWazuh1! | grep -q '\"status\" : \"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # WAZUH — MANAGER
  # ════════════════════════════════════════════════════════════════════════════
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.11
    ports:
      - "1514:1514/udp"   # Agent UDP registration
      - "1514:1514/tcp"   # Agent TCP registration
      - "1515:1515/tcp"   # Agent enrollment
      - "514:514/udp"     # Syslog ingestion
      - "55000:55000/tcp" # Wazuh REST API
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecureWazuh1!
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-var:/var/ossec/var
      - ./wazuh/manager/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./wazuh/manager/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:55000 -u wazuh-wui:MyS3cr3tP4ssword | grep -q 'title'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # WAZUH — DASHBOARD
  # ════════════════════════════════════════════════════════════════════════════
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.12
    ports:
      - "5601:5601"       # Wazuh Dashboard UI → https://localhost:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecureWazuh1!
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
      - ./wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    depends_on:
      wazuh-manager:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  # THEHIVE 5 — Cassandra backend + MinIO storage
  # ════════════════════════════════════════════════════════════════════════════
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.20
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.21
    ports:
      - "9000:9000"       # MinIO S3 API
      - "9001:9001"       # MinIO Console UI → http://localhost:9001
    environment:
      - MINIO_ROOT_USER=thehive
      - MINIO_ROOT_PASSWORD=MinioP@ssw0rd!
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  thehive:
    image: strangebee/thehive:5.4
    container_name: thehive
    hostname: thehive
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.22
    ports:
      - "9090:9000"       # TheHive UI → http://localhost:9090  (admin/secret)
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
    volumes:
      - thehive-data:/opt/thehive/data
      - thehive-index:/opt/thehive/index
      - ./thehive/application.conf:/etc/thehive/application.conf:ro
    depends_on:
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/status | grep -q 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ════════════════════════════════════════════════════════════════════════════
  # CORTEX 3
  # ════════════════════════════════════════════════════════════════════════════
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    hostname: cortex
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.23
    ports:
      - "9091:9001"       # Cortex UI → http://localhost:9091
    environment:
      - JVM_OPTS=-Xms256m -Xmx512m
    volumes:
      - cortex-data:/var/lib/cortex
      - ./cortex/application.conf:/etc/cortex/application.conf:ro
      # Docker socket mount allows Cortex to spawn analyzer containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - thehive
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9001/api/status | grep -q 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ════════════════════════════════════════════════════════════════════════════
  # SHUFFLE SOAR
  # ════════════════════════════════════════════════════════════════════════════
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.30
    ports:
      - "3001:80"         # Shuffle UI → http://localhost:3001
      - "3443:443"        # Shuffle UI HTTPS → https://localhost:3443
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    depends_on:
      - shuffle-backend

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.31
    ports:
      - "5001:5001"       # Shuffle backend API
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - OPENSEARCH_URL=http://shuffle-opensearch:9200
      - BACKEND_HOSTNAME=shuffle-backend
      - SHUFFLE_ENCRYPTION_MODIFIER=changeme_random_32char_string_here
      # Wazuh integration — set after Wazuh manager is confirmed healthy
      - WAZUH_URL=https://wazuh-manager:55000
      - WAZUH_USERNAME=wazuh-wui
      - WAZUH_PASSWORD=MyS3cr3tP4ssword
      # TheHive integration
      - THEHIVE_URL=http://thehive:9000
    volumes:
      - shuffle-data:/shuffle-files
      - shuffle-apps:/shuffle-apps
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - shuffle-opensearch

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.32
    environment:
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - discovery.type=single-node
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # SURICATA — Network IDS
  # Runs in host network mode to sniff virbr1 (VM target subnet bridge)
  # virbr1 will carry traffic between Kali attacker VM and Ubuntu target VM.
  # ════════════════════════════════════════════════════════════════════════════
  suricata:
    image: jasonish/suricata:7.0
    container_name: suricata
    hostname: suricata
    restart: unless-stopped
    # host network mode: Suricata binds directly to the host's virbr1 interface
    # This is intentional — bridge/macvlan cannot capture inter-VM traffic.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/var/lib/suricata/rules
      - ./suricata/logs:/var/log/suricata   # eve.json lives here
    # virbr1 is the interface Suricata will sniff.
    # Change this if your libvirt target network uses a different bridge name.
    command: ["-i", "virbr1", "--init-errors-fatal"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/suricata/eve.json"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
