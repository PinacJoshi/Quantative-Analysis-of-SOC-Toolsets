###############################################################################
#  SOC Cluster — Docker Compose
#  Week 2: Lab Infrastructure & Virtual Network Setup
#
#  Stack: Wazuh (Manager + Indexer + Dashboard) · TheHive 5 · Cortex 3
#         · Shuffle SOAR · Suricata (host-network, IDS-only)
#
#  Host machine: Fedora, Intel i5-11400H, 16 GB RAM
#  Network mode for SOC internal comms: custom bridge  soc-net (172.20.0.0/24)
#  Suricata: host network mode — sniffs virbr1 (VM target subnet bridge)
#
#  Usage:
#    docker compose up -d          # start all services
#    docker compose down -v        # stop and remove volumes
#    docker compose logs -f <svc>  # tail a service log
###############################################################################

name: soc-cluster

###############################################################################
# NETWORKS
###############################################################################
networks:
  soc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

###############################################################################
# VOLUMES
###############################################################################
volumes:
  # ── Wazuh ──────────────────────────────────────────────────────────────────
  wazuh-indexer-data:
  wazuh-manager-etc:
  wazuh-manager-var:
  wazuh-dashboard-config:

  # ── TheHive ────────────────────────────────────────────────────────────────
  thehive-data:
  thehive-index:
  cassandra-data:
  minio-data:

  # ── Cortex ─────────────────────────────────────────────────────────────────
  cortex-data:
  cortex-elasticsearch-data:

  # ── Shuffle ────────────────────────────────────────────────────────────────
  shuffle-data:
  shuffle-apps:
  opensearch-data:

###############################################################################
# SERVICES
###############################################################################
services:

  # ════════════════════════════════════════════════════════════════════════════
  # WAZUH — INDEXER (OpenSearch)
  # ════════════════════════════════════════════════════════════════════════════
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.10
    ports:
      - "9200:9200"       # OpenSearch REST API (local access only)
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro,z
      - ./wazuh/indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro,z
      - ./wazuh/certs:/usr/share/wazuh-indexer/certs:ro,z
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200/_cluster/health -u admin:SecureWazuh1! | grep -q '200'"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s

  # ════════════════════════════════════════════════════════════════════════════
  # WAZUH — MANAGER
  # ════════════════════════════════════════════════════════════════════════════
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.11
    ports:
      - "1514:1514/udp"   # Agent UDP registration
      - "1514:1514/tcp"   # Agent TCP registration
      - "1515:1515/tcp"   # Agent enrollment
      - "514:514/udp"     # Syslog ingestion
      - "55000:55000/tcp" # Wazuh REST API
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecureWazuh1!
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr3tP4ssword!
    volumes:
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-var:/var/ossec/var
      - ./wazuh/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro,z
      - ./wazuh/manager/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro,z
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:55000/security/user/authenticate -u wazuh-wui:MyS3cr3tP4ssword! | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ════════════════════════════════════════════════════════════════════════════
  # WAZUH — DASHBOARD
  # ════════════════════════════════════════════════════════════════════════════
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.12
    ports:
      - "5601:5601"       # Wazuh Dashboard UI → https://localhost:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecureWazuh1!
      - WAZUH_API_URL=https://wazuh-manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr3tP4ssword!
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
      - ./wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro,z
    depends_on:
      wazuh-manager:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════════════════════
  # THEHIVE 5 — Cassandra backend + MinIO storage
  # ════════════════════════════════════════════════════════════════════════════
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.20
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.21
    ports:
      - "9000:9000"       # MinIO S3 API
      - "9001:9001"       # MinIO Console UI → http://localhost:9001
    environment:
      - MINIO_ROOT_USER=thehive
      - MINIO_ROOT_PASSWORD=MinioP@ssw0rd!
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/thehive && exec minio server /data --console-address :9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  thehive:
    image: strangebee/thehive:5.4
    container_name: thehive
    hostname: thehive
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.22
    ports:
      - "9095:9000"       # TheHive UI → http://localhost:9095  (admin/secret)
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
      - TH_NO_CONFIG_SECRET=1
      - TH_CQL_HOSTNAMES=cassandra
      - TH_CQL_DATACENTER=datacenter1
      - TH_CQL_KEYSPACE=thehive
      - TH_S3_ENDPOINT=http://minio:9000
      - TH_S3_BUCKET=thehive
      - TH_S3_ACCESS_KEY=thehive
      - TH_S3_SECRET_KEY=MinioP@ssw0rd!
      - TH_S3_USE_PATH_ACCESS_STYLE=1
    user: "0:0"
    entrypoint: ["/bin/bash", "-c", "chown -R thehive:thehive /opt/thehive/data /opt/thehive/index && exec runuser -u thehive -- /opt/thehive/entrypoint \"$$@\"", "--"]
    volumes:
      - thehive-data:/opt/thehive/data
      - thehive-index:/opt/thehive/index
      - ./thehive/application.conf:/etc/thehive/application.conf:ro,z
    depends_on:
      cassandra:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/status | grep -q 'TheHive'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ════════════════════════════════════════════════════════════════════════════
  # CORTEX 3 — Elasticsearch backend
  # ════════════════════════════════════════════════════════════════════════════
  cortex-elasticsearch:
    image: elasticsearch:7.17.9
    container_name: cortex-elasticsearch
    hostname: cortex-elasticsearch
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.24
    environment:
      - http.host=0.0.0.0
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - cortex-elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ════════════════════════════════════════════════════════════════════════════
  # CORTEX 3
  # ════════════════════════════════════════════════════════════════════════════
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    hostname: cortex
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.23
    ports:
      - "9091:9001"       # Cortex UI → http://localhost:9091
    environment:
      - JVM_OPTS=-Xms256m -Xmx512m
    security_opt:
      - label:disable
    volumes:
      - cortex-data:/var/lib/cortex
      - ./cortex/application.conf:/etc/cortex/application.conf:ro,z
      # Docker socket mount allows Cortex to spawn analyzer containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      thehive:
        condition: service_healthy
      cortex-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9001/api/status | grep -q 'Cortex'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ════════════════════════════════════════════════════════════════════════════
  # SHUFFLE SOAR
  # ════════════════════════════════════════════════════════════════════════════
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.30
    ports:
      - "3001:80"         # Shuffle UI → http://localhost:3001
      - "3443:443"        # Shuffle UI HTTPS → https://localhost:3443
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    depends_on:
      - shuffle-backend

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.31
    ports:
      - "5001:5001"       # Shuffle backend API
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - SHUFFLE_OPENSEARCH_URL=http://shuffle-opensearch:9200
      - OPENSEARCH_URL=http://shuffle-opensearch:9200
      - BACKEND_HOSTNAME=shuffle-backend
      - SHUFFLE_ENCRYPTION_MODIFIER=changeme_random_32char_string_here
      # Wazuh integration — set after Wazuh manager is confirmed healthy
      - WAZUH_URL=https://wazuh-manager:55000
      - WAZUH_USERNAME=wazuh-wui
      - WAZUH_PASSWORD=MyS3cr3tP4ssword!
      # TheHive integration
      - THEHIVE_URL=http://thehive:9000
    security_opt:
      - label:disable
    volumes:
      - shuffle-data:/shuffle-files
      - shuffle-apps:/shuffle-apps
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - shuffle-opensearch

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.32
    environment:
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - discovery.type=single-node
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.33
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - BASE_URL=http://shuffle-backend:5001
      - DOCKER_API_VERSION=1.40
      - CLEANUP=true
      - ENVIRONMENT_NAME=Shuffle
      - ORBORUS_CONTAINER_NAME=shuffle-orborus
      - SHUFFLE_BASE_IMAGE_REGISTRY=ghcr.io
      - SHUFFLE_PASS_WORKER_NETWORK=soc-cluster_soc-net
      - SHUFFLE_PIPELINE_ENABLED=false
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      - shuffle-backend
      - docker-socket-proxy

  docker-socket-proxy:
    image: alpine/socat:latest
    container_name: docker-socket-proxy
    hostname: docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      soc-net:
        ipv4_address: 172.20.0.34
    command: TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock

  # ════════════════════════════════════════════════════════════════════════════
  # SURICATA Network IDS
  # Runs in host network mode to sniff virbr1 (VM target subnet bridge)
  # virbr1 will carry traffic between Kali attacker VM and Ubuntu target VM.
  # ════════════════════════════════════════════════════════════════════════════
  suricata:
    image: jasonish/suricata:7.0
    container_name: suricata
    hostname: suricata
    restart: unless-stopped
    # host network mode: Suricata binds directly to the host's virbr1 interface
    # This is intentional bridge/macvlan cannot capture inter-VM traffic.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:z
      - ./suricata/rules:/var/lib/suricata/rules:z
      - ./suricata/logs:/var/log/suricata:z
    command: ["-i", "virbr1"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/suricata/eve.json"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
