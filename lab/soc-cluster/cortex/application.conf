# Cortex 3 — application.conf
# Mounted at: /etc/cortex/application.conf
#
# Cortex runs analyzers and responders as Docker containers.
# The Docker socket is mounted read-only to allow analyzer spawning.

play.http.secret.key = "CortexSecretKeyForLabUseOnly12345678"

# ─── Docker-based job execution ──────────────────────────────────────────────
# Cortex spawns each analyzer as a short-lived Docker container.
job {
  runner: [docker]
}

docker {
  # Path to the Docker socket on the host
  # This is bind-mounted into the Cortex container (read-only in compose)
  # Cortex uses it to spawn analyzer containers on the host Docker daemon.
  socket: "/var/run/docker.sock"

  # Network for spawned analyzer containers
  network: "soc-cluster_soc-net"
}

# ─── Authentication ──────────────────────────────────────────────────────────
auth {
  providers: [
    { name: session }
    { name: basic, realm: cortex }
    { name: local }
    { name: key }
  ]
}

# ─── Analyzers / Responders cache ────────────────────────────────────────────
# Cortex will refresh this from the local Docker images
cache.job = 10 minutes

# ─── HTTP port ───────────────────────────────────────────────────────────────
http.port = 9001
play.server.http.port = 9001
